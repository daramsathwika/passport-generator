<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>

        <input type="text" id="password" placeholder="Your password">

        <label>Password Length: <span id="lengthValue">12</span></label>
        <input type="range" id="length" min="4" max="32" value="12">

        <p><input type="checkbox" id="uppercase" checked> Uppercase</p>
        <p><input type="checkbox" id="lowercase" checked> Lowercase</p>
        <p><input type="checkbox" id="numbers" checked> Numbers</p>
        <p><input type="checkbox" id="symbols" checked> Symbols</p>

        <button id="generateBtn">Generate Password</button>
        <button id="copyBtn">Copy Password</button>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
